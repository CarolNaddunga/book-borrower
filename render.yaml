databases:
  - name: book-borrower-db
    plan: free
    databaseName: book_borrower
    user: book_borrower
    ipAllowList: []

services:
  - type: web
    name: book-borrower
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: python manage.py migrate --noinput && python manage.py prepare_hosted_library && gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 2 --access-logfile -
    healthCheckPath: /accounts/login/
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.9
      - key: DJANGO_SETTINGS_MODULE
        value: config.review_settings
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: LIBRARIAN_USERNAME
        value: librarian
      - key: LIBRARIAN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: book-borrower-db
          property: connectionString
